[project]
name = "APITestGen"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "tushanxing", email = "tushanxing1995@gmail.com"},
]
dependencies = ["orjson>=3.11.3", "pysimdjson>=7.0.2", "pytest>=8.4.2"]
requires-python = "==3.10.*"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "-e file:///${PROJECT_ROOT}/#egg=APITestGen",
]
